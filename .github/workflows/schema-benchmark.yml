name: JSON Schema conformance and paired benchmark

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      smoke:
        description: One short A/B repetition instead of five full repetitions
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: schema-benchmark-${{ github.ref }}
  cancel-in-progress: false

jobs:
  paired-benchmark:
    name: Paired A/B — ${{ matrix.runtime }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        runtime: [native, moonx-wasm]
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          # Benchmark the actual PR head, never the synthetic merge commit.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Install latest MoonBit toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain and moonx dispatcher
        run: |
          moon version --all
          moonx --help | grep -F 'Run a standalone .mbtx file'

      - name: Paired baseline and candidate on this runner
        id: campaign
        timeout-minutes: 42
        env:
          BENCH_RUNTIME: ${{ matrix.runtime }}
          BENCH_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'push' && github.event.before || '' }}
          BENCH_SMOKE: ${{ inputs.smoke || 'false' }}
        run: python3 benchmarks/paired-campaign.py

      - name: Upload independent A/B evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schema-paired-${{ matrix.runtime }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            benchmark-results/paired/
          if-no-files-found: warn
          retention-days: 30
