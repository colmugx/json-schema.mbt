name: JSON Schema conformance and benchmark

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      smoke:
        description: One short repetition instead of five full repetitions
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: schema-benchmark-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install latest MoonBit toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Verify moonx dispatcher
        timeout-minutes: 3
        run: |
          moon version --all
          moonx --help | grep -F 'Run a standalone .mbtx file'

      - name: Resolve library dependencies
        run: moon update
      - name: Save official corpus and measure native release plus moonx Wasm
        id: campaign
        timeout-minutes: 35
        run: moonx benchmarks/run-campaign.mbtx ${{ inputs.smoke && 'smoke' || '' }}
      - name: Publish summary, including incomplete execution
        if: always() && (steps.campaign.outcome == 'success' || steps.campaign.outcome == 'failure')
        run: moonx benchmarks/report.mbtx
      - name: Preserve corpus, results and raw evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schema-benchmark-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            benchmark-results/
            !benchmark-results/_build/
          if-no-files-found: warn
          retention-days: 30
