name: JSON Schema conformance and benchmark

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      toolchain:
        description: Exact MoonBit version used for both compiler binaries and core
        required: true
        default: '0.10.14+7d59c7ec9'
        type: string
      smoke:
        description: One short repetition instead of five full repetitions
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: schema-benchmark-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain bundle and pinned core
        uses: hustcer/setup-moonbit@v1.22
        with:
          version: ${{ inputs.toolchain || '0.10.14+7d59c7ec9' }}
          core-version: ${{ inputs.toolchain || '0.10.14+7d59c7ec9' }}

      - name: Bootstrap genuine moonx dispatcher and verify compiler
        timeout-minutes: 3
        env:
          EXPECTED_COMPILER: ${{ inputs.toolchain || '0.10.14+7d59c7ec9' }}
        run: |
          mkdir -p .ci-bin
          install -m 755 "$(command -v moon)" .ci-bin/moonx
          .ci-bin/moonx --help | grep -F 'Run a standalone .mbtx file'
          moon version --all
          actual_compiler="$(moonc -v 2>&1)"
          printf '%s\n' "$actual_compiler"
          if ! grep -Fq "v${EXPECTED_COMPILER} (" <<< "$actual_compiler"; then
            echo "::error::Expected moonc v${EXPECTED_COMPILER}; got: ${actual_compiler}"
            exit 1
          fi
          echo "$PWD/.ci-bin" >> "$GITHUB_PATH"

      - name: Resolve library dependencies
        run: moon update
      - name: Save official corpus and measure native release plus moonx Wasm
        id: campaign
        timeout-minutes: 35
        run: moonx benchmarks/run-campaign.mbtx ${{ inputs.smoke && 'smoke' || '' }}
      - name: Publish summary, including incomplete execution
        if: always() && (steps.campaign.outcome == 'success' || steps.campaign.outcome == 'failure')
        run: moonx benchmarks/report.mbtx
      - name: Preserve corpus, results and raw evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schema-benchmark-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            benchmark-results/
            !benchmark-results/_build/
          if-no-files-found: warn
          retention-days: 30
